name: Release

# Ao criar uma tag como v1.0.0, gera o instalador e publica na aba Releases.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Gerar e publicar o instalador
    runs-on: windows-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Testar antes de publicar
        run: dotnet test OtimizadorPC.sln -c Release

      - name: Gerar o instalador
        shell: pwsh
        run: ./build/Publicar.ps1 -Versao ("${{ github.ref_name }}".TrimStart('v'))

      - name: Publicar a release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = (Get-Item artifacts/OtimizadorPC-Setup-*.exe).FullName
          $notas = "docs/notas/${{ github.ref_name }}.md"
          if (Test-Path $notas) {
            gh release create "${{ github.ref_name }}" $setup --title "OtimizadorPC ${{ github.ref_name }}" --notes-file $notas
          } else {
            gh release create "${{ github.ref_name }}" $setup --title "OtimizadorPC ${{ github.ref_name }}" --generate-notes
          }
