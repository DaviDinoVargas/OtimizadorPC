name: Build e testes

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Compilar e testar (Windows)
    runs-on: windows-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar pacotes
        run: dotnet restore OtimizadorPC.sln

      - name: Compilar
        run: dotnet build OtimizadorPC.sln -c Release --no-restore

      - name: Testar
        run: dotnet test OtimizadorPC.sln -c Release --no-build --logger trx --results-directory TestResults

      - name: Guardar resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-dos-testes
          path: TestResults
